name: CI

on:
  push:
    branches: [main]
  pull_request:

defaults:
  run:
    working-directory: research-workspace

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: rw
          POSTGRES_PASSWORD: rw_dev_password
          POSTGRES_DB: rwtest
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U rw" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      # The DB tests DROP and recreate the public schema: this is a throwaway CI database.
      TEST_DATABASE_URL: postgresql://rw:rw_dev_password@localhost:5432/rwtest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: research-workspace/services/ai/requirements*.txt
      - run: pip install -r services/ai/requirements.txt -r services/ai/requirements-dev.txt
      - name: AI service tests (database tests included, none may be skipped)
        working-directory: research-workspace/services/ai
        run: python -m pytest -q -rs --no-header
      - name: Python gateway tests
        run: python -m pytest services/gateway/test_gateway_py.py -q --no-header

  gateway-go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: research-workspace/services/gateway/go.mod
      - run: go test -race ./...
        working-directory: research-workspace/services/gateway

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: research-workspace/apps/web/package-lock.json
      - run: npm ci
        working-directory: research-workspace/apps/web
      - run: npm run typecheck && npm test
        working-directory: research-workspace/apps/web
      - run: npm run build
        working-directory: research-workspace/apps/web
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8080
