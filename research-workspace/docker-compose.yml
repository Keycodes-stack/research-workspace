services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rw}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rw_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-research_workspace}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rw}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: cgr.dev/chainguard/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - miniodata:/data

  ai:
    build: ./services/ai
    env_file: .env
    environment:  # container-network addresses override the host-style values in .env
      DATABASE_URL: postgresql://${POSTGRES_USER:-rw}:${POSTGRES_PASSWORD:-rw_dev_password}@postgres:5432/${POSTGRES_DB:-research_workspace}
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT_URL: http://minio:9000
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      minio: {condition: service_started}
    volumes:
      - models:/models  # embedding model is downloaded once, then cached
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    restart: unless-stopped

  gateway:
    build: ./services/gateway
    env_file: .env
    environment:
      AI_URL: http://ai:8000
      CORS_ORIGINS: http://localhost:3000
    depends_on:
      ai: {condition: service_healthy}
    ports:
      - "8080:8080"
    restart: unless-stopped

  web:
    build: ./apps/web
    depends_on:
      - gateway
    ports:
      - "3000:3000"
    restart: unless-stopped

volumes:
  pgdata:
  miniodata:
  models:
